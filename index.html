<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Frame by frame drawing</title>
<style>
    :root {
        --background: #0C0D0F;
        --foreground: #fefcfb;
        --highlight: #1282a2;
        --muted: #14171B;
    }

    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        width: 100vw;
        margin: 0;
        background-color: var(--background);
        color: var(--foreground);
    }
	.content {
		display: flex;
		flex-direction: column;
        align-items: center;
        margin-top: 10px;
	}

    .setup {
        display: flex;
        flex-direction: column;
        width: 200px;
        padding: 10px 5px;
    }

    .main {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 5px;
    }

    .controlsContainer {
        display: flex;
        flex-direction: column;
        width: 100%
    }

    .seeker {
        width: 100%;
    }

    #seeker {
        width: 100%;
    }

    .videoControls {
        width: 100%;
        display: flex;
        justify-content: space-between;
    }
    .playbackControls {
        gap: 10px;
    }

    .viewer {
        position: relative;
        display: inline-block;
        width: 100%
    }

    .viewerContent {
        width: 97vw;
        height: 500px;
        max-width: 97vw;
        max-height: 80vh;
    }

    #video {
        object-fit: contain;
        background: black;
    }

    #canvas {
        position: absolute;
        top: 0;
        left: 0;
    }
    .slider {
        -webkit-appearance: none;
        appearance: none;
        height: 6px;
        background: var(--muted);
        border-radius: 20px;
    }
    .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        background: var(--highlight);
        cursor: pointer;
    }
	
</style>
</head>
<body>
	<div class="content">
		<div class="setup">
			<input type="file" id="videoInput" accept="video/*">
            <button onclick="clearCanvas()">Clear canvas</button>
            <input type="color" id="colorPicker" value="#000000">
		</div>
        <div class="main">
            <div class="viewer">
                <video id="video" class="viewerContent"></video>
                <canvas id="canvas" class="viewerContent"></canvas>
            </div>
        </div>
		<div class="controlsContainer">
            <div class="seeker">
                <input id="seeker" class="slider" type="range" min="0" max="1000" value="0">
            </div>
            <div class="videoControls">
                <div class="playbackControls">
                    <button id="playPause" class="buttonControls">Play</button>
                    <button id="prevFrame" class="buttonControls">◀</button>
                    <button id="nextFrame" class="buttonControls">▶</button>
                </div>
                <div class="volumeControls">
                    <input id="volumeSlider" class="slider" type="range" min="0" max="1000" value="1000">
                </div>
            </div>
		</div>
	
	</div>

<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.4/dist/mp4box.all.min.js"></script>
<script>

const fileInput = document.getElementById("videoInput");
const video = document.getElementById("video");
const colorInput = document.getElementById("colorPicker");

// video controls
const playPauseBtn = document.getElementById("playPause");
const seekerSlider = document.getElementById("seeker");
const volumeSlider = document.getElementById("volumeSlider");
const prevFrameBtn = document.getElementById("prevFrame");
const nextFrameBtn = document.getElementById("nextFrame");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let videoFps = -1;


function setVideoSize() {
    let displayWidth = video.videoWidth;
    let displayHeight = video.videoHeight;

    if (displayWidth < 1000) {
        displayWidth *= 2;
        displayHeight *= 2;
    }

    const maxWidth = window.innerWidth * 0.97;

    if (displayWidth > maxWidth) {
        const scale = maxWidth / displayWidth;
        displayWidth *= scale;
        displayHeight *= scale;
    }

    video.style.width = displayWidth + "px";
    video.style.height = displayHeight + "px";

}

// CANVAS FUNCTIONS
let canDraw = false;
let drawing = false;

function startDraw(e) {
	drawing = true;
	draw(e);
}

function endDraw() {
	drawing = false;
	ctx.beginPath();
}

function draw(e) {
    if (!canDraw) return;
	if (!drawing) return;

	const rect = canvas.getBoundingClientRect();
	const x = e.clientX - rect.left;
	const y = e.clientY - rect.top;

	ctx.lineWidth = 3;
	ctx.lineCap = "round";
	ctx.lineTo(x, y);
	ctx.stroke();
	ctx.beginPath();
	ctx.moveTo(x, y);
}

function clearCanvas() {
	ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// CANVAS HANDLERS
canvas.addEventListener("mousedown", startDraw);
canvas.addEventListener("mouseup", endDraw);
canvas.addEventListener("mouseout", endDraw);
canvas.addEventListener("mousemove", draw);

canvas.addEventListener("touchstart", startDraw);
canvas.addEventListener("touchend", endDraw);
canvas.addEventListener("touchmove", draw);


// EVENT HANDLERS
colorInput.onchange = () => {
    const color = colorInput.value;
    ctx.strokeStyle = color;
}

prevFrameBtn.onclick = () => {
    if (video.currentTime > 0) {
        video.currentTime -= 1 / videoFps;
    }
};

nextFrameBtn.onclick = () => {
    if (video.currentTime < video.duration) {
        video.currentTime += 1 / videoFps;
    }
};

playPauseBtn.onclick = () => {
    if (!video.src) return;
    if (video.paused) {
        video.play();
        playPauseBtn.textContent = "Pause";
    } else {
        video.pause();
        playPauseBtn.textContent = "Play";
    }
};

video.addEventListener("timeupdate", () => {
    seekerSlider.value = Math.round(video.currentTime * videoFps)
});

seekerSlider.addEventListener("input", () => {
    video.currentTime = seekerSlider.value / videoFps;
});

video.addEventListener("ended", () => {
    playPauseBtn.textContent = "Play";
});

volumeSlider.addEventListener("input", () => {
    if (!video.src) return;
    video.volume = volumeSlider.value / 1000;
});


fileInput.addEventListener("change", () => {
		const file = fileInput.files[0];
		if (!file) return;

		// Release previous object URL if there was one
		if (video.src) {
				URL.revokeObjectURL(video.src);
		}

		const url = URL.createObjectURL(file);
		video.src = url;
		video.load();

        // reading video metadata with mp4box
        const mp4boxFile = MP4Box.createFile();

        mp4boxFile.onReady = (info) => {

            const track = info.videoTracks[0];
            const fps = track.nb_samples * track.timescale / track.duration;
            videoFps = fps;
            seekerSlider.max = track.nb_samples - 1;
            console.log(info);
        };

        const reader = new FileReader();

        reader.onload = (e) => {
            const buffer = e.target.result;

            // MP4Box requires this property
            buffer.fileStart = 0;

            mp4boxFile.appendBuffer(buffer);
            mp4boxFile.flush();
        };

        reader.readAsArrayBuffer(file);
});

video.addEventListener("loadedmetadata", () => {
    // video.style.width = "auto";
    // video.style.height = "auto";
    setVideoSize();
    seekerSlider.value = 0;
    canvas.width = video.clientWidth;
    canvas.height = video.clientHeight;
    canDraw = true;
    canvas.style.width = video.clientWidth + "px";
    canvas.style.height = video.clientHeight + "px";
    ctx.strokeStyle = colorInput.value;
})
</script>

</body>
</html>
